<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15102e">
<meta name="description" content="Mon passeport de compétences – Français 2de Bac Pro">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon passeport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<title>Mon passeport de compétences – Français 2de</title>
<style>
:root{--bg:#15102e;--card:#1f1846;--card2:#271f57;--tx:#eeeafb;--mut:#a39dc9;--bd:#33296e;--ac:#9d8cff;--hot:#ff8a2b;
 --ecrit:#3fa9ff;--oral:#c25bff;--gram:#39e07a;--verbes:#ff8a2b;--ortho:#ff3d7f;--lex:#ffc93c;
 --hud:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--txt:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font-family:var(--txt);font-size:1.02rem;line-height:1.5;color:var(--tx);min-height:100vh;
 background:radial-gradient(1100px 600px at 50% -200px,#2c1f6e 0%,transparent 70%),
 radial-gradient(700px 500px at 110% 40%,rgba(194,91,255,.10),transparent 70%),
 radial-gradient(700px 500px at -10% 70%,rgba(63,169,255,.08),transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:920px;margin:auto;padding:22px 16px 60px}
h1,h2,h3{font-family:var(--hud);letter-spacing:.01em;line-height:1.15}
h1{margin:.1em 0;font-size:clamp(1.9rem,6vw,3rem);font-weight:700}
h2{font-size:1.25rem;font-weight:600;margin:2.2em 0 .8em;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--txt);font-weight:400;font-size:.85rem;color:var(--mut)}
a{color:var(--ac)}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px}
.sub{color:var(--mut);margin:0 0 16px}.msg{margin:10px 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}

/* ---------- Accueil ---------- */
#accueil{position:relative;text-align:center;padding:26px 0 8px;min-height:min(78vh,720px);display:flex;flex-direction:column;justify-content:center}
#accueil .mur{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;max-width:640px;margin:0 auto 26px;opacity:.9}
#accueil .mur img{width:100%;aspect-ratio:1;object-fit:contain;filter:grayscale(1) brightness(.32);transition:filter .5s}
#accueil .mur img.on{filter:none;animation:allume 2.6s ease-in-out}
@keyframes allume{0%{filter:grayscale(1) brightness(.32)}35%,65%{filter:drop-shadow(0 0 10px var(--g,#fff))}100%{filter:grayscale(1) brightness(.32)}}
#accueil h1{background:linear-gradient(180deg,#fff 30%,#c9bfff);-webkit-background-clip:text;background-clip:text;color:transparent}
#accueil .sub{font-size:1.05rem}
.entree{display:flex;gap:8px;max-width:460px;margin:18px auto 0}
#codein{flex:1;min-width:0;padding:15px 16px;font:600 1.15rem var(--hud);letter-spacing:.12em;text-transform:uppercase;border-radius:14px;border:2px solid var(--bd);background:#0f0b24;color:var(--tx)}
#codein:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 4px rgba(157,140,255,.25)}
#codein::placeholder{letter-spacing:.02em;font-weight:400;color:#6f68a0}
#codego,.bt{font:700 1rem var(--hud);border:0;border-radius:14px;padding:0 22px;cursor:pointer;color:#1a1033;background:linear-gradient(180deg,#ffb067,#ff8a2b);box-shadow:0 6px 0 #b4561a,0 10px 24px rgba(255,138,43,.35);transition:transform .08s}
#codego:active,.bt:active{transform:translateY(3px);box-shadow:0 3px 0 #b4561a}
#codemsg{min-height:1.5em}

/* ---------- Carte joueur ---------- */
.joueur{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:14px;padding:20px;
 background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:22px}
.anneau{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
 background:conic-gradient(var(--hot) calc(var(--p)*1%),#2e2566 0);position:relative}
.anneau::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.anneau>div{position:relative;text-align:center}.anneau b{font:700 2rem var(--hud);line-height:1}.anneau small{display:block;font:500 .78rem var(--txt);color:var(--mut);text-align:center}
.joueur .rang{font:700 1.5rem var(--hud);margin:0}
.joueur .qui{color:var(--mut);margin:2px 0 10px}
.joueur .xp{display:inline-flex;gap:14px;flex-wrap:wrap;font-size:.92rem}
.joueur .xp span b{font-family:var(--hud);font-size:1.05rem;color:#fff}
.domaines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin-top:14px;grid-column:1/-1}
.dom{font-size:.85rem;color:var(--mut)}.dom b{color:var(--tx);font-weight:700}
.dom .j{height:7px;border-radius:9px;background:#2e2566;margin-top:4px;overflow:hidden}
.dom .j i{display:block;height:100%;border-radius:9px;background:var(--c);box-shadow:0 0 10px var(--c)}

/* ---------- Prochaine mission ---------- */
.mission{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px;border-radius:20px;
 background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--c) 55%,var(--bd))}
.mission img{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 0 16px var(--c))}
.mission h3{margin:0 0 2px;font-size:1.35rem}.mission p{margin:0 0 12px;color:var(--mut)}
.mission .bt{display:inline-flex;align-items:center;height:46px;text-decoration:none}
.bt2{font:600 .95rem var(--hud);display:inline-flex;align-items:center;height:46px;padding:0 16px;margin-left:8px;border-radius:14px;border:1.5px solid var(--bd);color:var(--tx);text-decoration:none;background:transparent;cursor:pointer}
.bt2:hover{border-color:var(--ac)}
.defi{display:inline-block;font:600 .78rem var(--hud);color:#1a1033;background:var(--lex);border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:2px}

/* ---------- Parcours (séances) ---------- */
.parcours{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.parcours::before{content:"";position:absolute;left:10%;right:10%;top:34px;height:3px;background:#2e2566;border-radius:3px}
.parcours li{position:relative;text-align:center;padding:0 4px}
.parcours .pt{position:relative;display:block;width:68px;height:68px;margin:0 auto 8px;border-radius:50%;background:var(--card);border:2px solid var(--bd);padding:6px;cursor:pointer}
.parcours .pt img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) brightness(.45)}
.parcours li.ok .pt{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.parcours li.ok .pt img,.parcours li.now .pt img{filter:none}
.parcours li.now .pt{border-color:var(--hot);box-shadow:0 0 0 5px rgba(255,138,43,.18)}
.parcours .n{font:600 .78rem var(--hud);color:var(--mut)}.parcours .t{display:block;font-weight:700;font-size:.88rem;line-height:1.2}
.parcours .e{display:block;font-size:.76rem;color:var(--mut);margin-top:2px}.parcours li.now .e{color:var(--hot);font-weight:700}

/* ---------- Vitrine des badges ---------- */
.rayon{margin:0 0 26px}
.rayon h3{font-size:1.02rem;margin:0 0 10px;color:var(--c);display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid color-mix(in srgb,var(--c) 35%,transparent);padding-bottom:6px}
.rayon h3 small{font:500 .82rem var(--txt);color:var(--mut)}
.etagere{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.bdg{position:relative;display:block;width:100%;font:inherit;color:inherit;text-align:center;background:none;border:0;padding:8px 4px;border-radius:16px;cursor:pointer}
.bdg .im{display:block;position:relative;width:92px;height:92px;margin:0 auto 6px;overflow:hidden;border-radius:22px}
.bdg img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) brightness(.3) contrast(.9);transition:transform .25s}
.bdg .nm{display:block;font-weight:700;font-size:.86rem;line-height:1.2;color:var(--mut)}
.bdg .st{display:block;font-size:.74rem;color:#6f68a0;margin-top:2px}
.bdg .cad{position:absolute;right:calc(50% - 50px);top:2px;font-size:.95rem;filter:grayscale(1)}
.bdg.val img{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c) 75%,transparent))}
.bdg.val .im{overflow:visible}
.bdg.val .nm{color:var(--tx)}.bdg.val .st{color:var(--c)}
.bdg.acq img{filter:saturate(.8)}.bdg.acq .im{overflow:visible}
.bdg.acq .im::after{content:"";position:absolute;inset:-5px;border-radius:26px;border:2px dashed var(--lex);opacity:.8}
.bdg.acq .nm{color:var(--tx)}.bdg.acq .st{color:var(--lex)}
.bdg.plan .st{color:var(--hot)}.bdg.plan img{filter:grayscale(.6) brightness(.55)}
.bdg:hover img,.bdg:focus-visible img{transform:scale(1.07)}

/* ---------- Fiche détaillée d'un badge ---------- */
#vue{border:0;padding:0;background:transparent;color:var(--tx);max-width:min(420px,calc(100vw - 32px));width:100%}
#vue::backdrop{background:rgba(8,5,22,.78);backdrop-filter:blur(4px)}
#vue .boite{position:relative;text-align:center;padding:26px 22px 22px;border-radius:24px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--c) 50%,var(--bd))}
#vue img{width:168px;height:168px;object-fit:contain}
#vue.val img{filter:drop-shadow(0 0 22px var(--c))}
#vue.lock img{filter:grayscale(1) brightness(.35)}
#vue h3{font-size:1.5rem;margin:10px 0 2px}#vue .dm{color:var(--c);font:600 .95rem var(--hud)}
#vue p{color:var(--mut);margin:12px 0 18px}
#vue .act{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#vue .act .bt{height:46px;display:inline-flex;align-items:center;text-decoration:none}#vue .act .bt2{margin:0}
#vue .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.2rem;cursor:pointer}

/* ---------- Badge débloqué (cérémonie) ---------- */
#deblo{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(8,5,22,.95);text-align:center;padding:20px}
#deblo.on{display:grid}
#deblo .rays{position:absolute;width:520px;height:520px;left:50%;top:50%;margin:-260px 0 0 -260px;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 45%,transparent) 0 8deg,transparent 8deg 22deg);
 -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:tourne 14s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
#deblo .in{position:relative}
#deblo img{width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 0 28px var(--c));animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
#deblo .k{font:600 1rem var(--hud);color:var(--c);margin:14px 0 0}
#deblo h3{font-size:2rem;margin:4px 0 6px}
#deblo p{color:var(--mut);margin:0 0 20px}
#deblo .bt{height:50px;padding:0 28px}

@media (max-width:620px){
 .joueur{grid-template-columns:1fr;text-align:center;justify-items:center}
 .domaines{grid-template-columns:repeat(2,1fr);width:100%;text-align:left}
 .mission{grid-template-columns:1fr;text-align:center;justify-items:center}
 .bt2{margin:8px 0 0}
 .parcours{grid-template-columns:1fr;gap:10px}.parcours::before{left:33px;right:auto;top:10px;bottom:10px;width:3px;height:auto}
 .parcours li{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;text-align:left}
 .parcours .pt{margin:0}
 .etagere{grid-template-columns:repeat(3,1fr);gap:6px}.bdg .im{width:84px;height:84px}
 #accueil .mur{grid-template-columns:repeat(6,1fr);max-width:360px}#accueil .mur img:nth-child(n+19){display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Fiches en ligne ---------- */
#fx button{font:700 1rem var(--hud);padding:12px 20px;border:0;border-radius:14px;color:#1a1033;background:linear-gradient(180deg,#ffb067,#ff8a2b);box-shadow:0 5px 0 #b4561a;cursor:pointer;margin:4px 6px 8px 0}
#fx button.alt{background:var(--card2);color:var(--tx);box-shadow:0 5px 0 #120d2b;border:1px solid var(--bd)}
#fx h1{font-size:1.45rem;margin:0}#fx .top{display:flex;gap:16px;align-items:center;margin:14px 0}#fx .top img{width:96px;filter:drop-shadow(0 0 14px var(--c,#9d8cff))}
#fx .card{margin-bottom:14px}#fx h2{font-size:1.1rem;margin:0 0 4px;color:var(--c,var(--ac))}#fx .c{color:var(--mut);margin:0 0 10px;font-size:.95rem}
#fx .q{padding:11px 0;border-top:1px solid var(--bd);line-height:1.7}#fx .n{display:inline-block;min-width:28px;font:700 1rem var(--hud);color:var(--c,var(--ac))}
#fx .sup{background:#120d2b;border-left:4px solid var(--c,var(--ac));padding:10px 14px;border-radius:10px;margin:0 0 12px}
#fx input[type=text],#fx textarea,#fx select{font:inherit;padding:6px 10px;border:2px solid var(--bd);border-radius:10px;background:#0f0b24;color:var(--tx);max-width:100%;width:auto;margin:2px 0}
#fx input[type=text]:focus,#fx textarea:focus,#fx select:focus{border-color:var(--c,var(--ac));outline:none}
#fx input[type=text]{width:160px}#fx input.wide{width:100%;display:block;margin-top:6px}#fx textarea{width:100%;min-height:80px;display:block}
#fx input:disabled,#fx textarea:disabled,#fx select:disabled{opacity:.7}
#fx .pre{color:var(--mut);font-size:.92rem}#fx .fb{margin:6px 0 0 28px;font-size:.93rem;padding:8px 12px;border-radius:10px;line-height:1.45}
#fx .fb.ok{background:rgba(57,224,122,.12);color:#7ff0ad}#fx .fb.ko{background:rgba(255,61,127,.12);color:#ff9cbd}#fx .fb.wait{background:rgba(255,201,60,.14);color:#ffe08a}
#fx .score{font:700 3rem var(--hud)}#fx .big{font-size:1.1rem}#fx textarea.res{min-height:150px;font-family:ui-monospace,monospace;font-size:.82rem}#fx details{margin:10px 0}#fx summary{cursor:pointer;font-weight:700;color:var(--ac)}
#fx .q.vide{background:rgba(255,138,43,.1);border-radius:10px;box-shadow:inset 4px 0 0 var(--hot);padding-left:10px}
#fx .fb b{font-weight:700}
#fx .bar{height:12px;background:#2e2566;border-radius:9px;overflow:hidden;margin:8px auto;max-width:360px}#fx .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lex),var(--hot));border-radius:9px}
#fx .envoi{margin:12px 0;padding:10px 12px;border-radius:12px;background:#120d2b}#fx .envoi.ok{background:rgba(57,224,122,.12);color:#9ff5c2}#fx .envoi.ko{background:rgba(255,201,60,.14);color:#ffe08a}#fx #secours{margin-top:8px}
#fx .nocoll{margin:6px 0 0 28px;font-size:.9rem;padding:6px 10px;border-radius:10px;background:rgba(255,201,60,.16);color:#ffe08a}
#fx audio{width:100%;margin:6px 0}
.hello{font:700 1.3rem var(--hud);margin:18px 0 8px}
</style></head><body><main>
<div id="home"><section id="accueil"><div class="mur" aria-hidden="true"></div><h1>Mon passeport</h1><p class="sub">Français, 2de Bac Pro. Vingt-deux badges à débloquer, fiche après fiche.</p>
<div class="entree"><input id="codein" placeholder="Ton code personnel" maxlength="12" autocomplete="off" autocapitalize="characters" aria-label="Ton code personnel"><button id="codego">Entrer</button></div><p id="codemsg" class="msg" role="status"></p></section><div id="out"></div></div><div id="fx" style="display:none"></div></main>
<dialog id="vue"></dialog><div id="deblo" role="dialog" aria-modal="true" aria-label="Badge débloqué"></div>
<script>

const nzs=(s,ai)=>{s=s.normalize("NFC").toLowerCase().replace(/’/g,"'");if(ai)s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");return s.replace(/[«»"'‑\-.!?;:,\[\]()…]+/g," ").replace(/\s+/g," ").trim()};

function gw(w,v,ai){
 if(w.k==="s")return w.ok.includes(v);
 if(w.k==="t")return w.ok.some(a=>nzs(a,ai)===nzs(v,ai));
 if(w.k==="p")return w.v.some(a=>nzp(a)===nzp(v));
 const t=nzs(v,ai);
 if(w.k==="x")return new RegExp(w.re,"i").test(t);

}
function gi(it,v,ai){
 if(it.cond){if(!gw(it.w[0],v[0]||"",ai))return false;return it.w[0].ok[0]==="Correct"?true:gw(it.w[1],v[1]||"",ai)}
 return it.w.every((w,i)=>gw(w,v[i]||"",ai));
}

const dist=(x,y)=>{if(Math.abs(x.length-y.length)>3)return 9;const d=Array.from({length:x.length+1},(_,i)=>[i]);for(let j=1;j<=y.length;j++)d[0][j]=j;for(let i=1;i<=x.length;i++)for(let j=1;j<=y.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(x[i-1]===y[j-1]?0:1));return d[x.length][y.length]};
function presque(it,v,ai){ // réponse courte à une ou deux lettres près ?
 return it.w.some((w,i)=>{const r=v[i]||"";if(w.k==="t")return w.ok.some(a=>{const A=nzs(a,ai),R=nzs(r,ai);return R&&A.length>=4&&A!==R&&dist(A,R)<=Math.max(1,Math.floor(A.length/6))});
  if(w.k==="p")return w.v.some(a=>{const A=nzp(a),R=nzp(r);return R&&A!==R&&dist(A,R)<=2});return false});
}
function conseil(k,it,v,ai,rang){
 if(presque(it,v,ai))return "Tu y es presque ! Vérifie l'orthographe, les accents et la ponctuation.";
 if(it.hint)return it.hint;
 const t=it.w[it.w.length-1].k,l=CONSEIL[F[k][1]]||[CONSEIL_TYPE.x];
 if(t==="p"||t==="a")return CONSEIL_TYPE[t];
 if(t==="s"&&rang%2===0)return CONSEIL_TYPE.s;
 return l[Math.floor(rang/(t==="s"?2:1))%l.length];
}
const lit=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},ecrit=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function valeurs(it){return [...document.querySelectorAll(`#fx [data-q="${it.n}"]`)].sort((a,b)=>a.dataset.i-b.dataset.i)}
function manque(it){ // la question n'a pas (encore) de réponse
 const el=valeurs(it),v=el.map(x=>x.value.trim());
 if(it.cond)return !v[0]||(v[0]==="Incorrect"&&!v[1]);
 return it.w.some((w,i)=>!v[i]||(w.k==="p"&&nzp(v[i])===nzp(w.init||"")));
}
/* Envoi automatique au tableau du prof (Google Sheets). Le tableur recorrige lui-même la fiche. */
const ENVOI_URL="https://script.google.com/macros/s/AKfycbyId8N77KkWxyNEiLrWSbToCs0_IBjtVMAYFpJUJwOEN9aCh-AJzPStdw362jAwrc9ehA/exec";
const MSG_DECISION={
 "Oui":"🎖️ <b>Badge validé !</b> Il apparaîtra dans ton passeport d'ici 2 minutes : recharge la page pour le voir.",
 "À valider":"⏳ <b>Fiche réussie !</b> Ton prof va valider ce badge. En attendant, il apparaît comme « Acquis » dans ton passeport.",
 "Déjà à valider":"⏳ Fiche réussie : ton prof doit encore valider ce badge.",
 "Déjà validée":"🎖️ Ce badge était déjà validé. Bravo, tu t'entraînes encore !",
 "Non réussie":"📝 Résultat enregistré. Corrige tes erreurs pour décrocher le badge."};
async function envoyer(k,s,items,zone,secours){
 if(!ENVOI_URL){secours.open=true;return}
 zone.innerHTML="📨 Envoi de ton résultat à ton prof…";
 const rep={};items.forEach(it=>{rep[it.n]=valeurs(it).map(x=>x.value)});
 try{
  const r=await fetch(ENVOI_URL,{method:"POST",body:JSON.stringify({code:s.code,fiche:k,rep})});
  const d=await r.json();
  if(!d.ok)throw new Error(d.erreur||"refusé");
  zone.innerHTML=`✅ Résultat enregistré dans le tableau de ton prof (tentative n°${d.tentative}).<br>${MSG_DECISION[d.decision]||""}`;
  zone.className="envoi ok";
 }catch(e){
  zone.innerHTML="⚠️ L'envoi automatique n'a pas fonctionné"+(e.message&&e.message!=="Failed to fetch"?" ("+e.message+")":"")+". Copie ton résultat ci-dessous et envoie-le à ton prof (ENT, Pronote…).";
  zone.className="envoi ko";secours.open=true;
 }
}
/* BLOQUE_COLLAGE : dans les fiches, les réponses s'écrivent au clavier (pas de copier-coller ni de glisser-déposer). */
(()=>{const fx=$("fx");
 const champ=t=>t&&t.closest&&t.closest("#fx")&&(t.tagName==="TEXTAREA"||(t.tagName==="INPUT"&&t.type==="text"));
 const avertir=t=>{const q=t.closest(".q");if(!q)return;let m=q.querySelector(".nocoll");
  if(!m){m=document.createElement("div");m.className="nocoll";q.insertBefore(m,q.querySelector(".fbk"))}
  m.textContent="✋ Écris ta réponse toi-même : le copier-coller est désactivé dans les fiches.";
  clearTimeout(m._t);m._t=setTimeout(()=>m.remove(),4000)};
 const bloque=e=>{if(champ(e.target)){e.preventDefault();avertir(e.target)}};
 fx.addEventListener("paste",bloque,true);
 fx.addEventListener("drop",bloque,true);
 fx.addEventListener("dragover",e=>{if(champ(e.target))e.preventDefault()},true);
 // collage depuis le menu du téléphone, ou longue suggestion du presse-papiers d'un clavier mobile
 fx.addEventListener("beforeinput",e=>{if(!champ(e.target))return;
  const t=e.inputType||"";
  if(t==="insertFromPaste"||t==="insertFromDrop"||t==="insertFromYank"||((t==="insertText"||t==="insertReplacementText")&&(e.data||"").length>15)){e.preventDefault();avertir(e.target)}},true);
})();
function openFiche(k){
 const f=FI[k],s=D[sel.value];if(!f||!s)return;
 $("home").style.display="none";const fx=$("fx");fx.style.display="";fx.style.setProperty("--c",C[F[k][1]]);
 const cleT="tentatives:"+s.code+":"+k;
 fx.innerHTML=`<button class="alt" onclick="closeFiche()">Retour à mon passeport</button><div class="top">${IMG[k]?`<img src="${IMG[k]}" alt="">`:""}<div><h1>Fiche n°${k} · ${f.name}</h1><p class="sub">${f.comp} · 20 questions · code ${s.code}</p></div></div>`+
 (f.lesson?`<details><summary>📖 Revoir la leçon</summary><div class="card">${f.lesson}</div></details>`:`<p class="sub">📖 <a href="${L(k)}" target="_blank" rel="noopener">Revoir la leçon (PDF)</a></p>`)+
 f.ex.map(e=>`<div class="card"><h2>${e.t}</h2><p class="c">${e.c}</p>${e.sup?`<div class="sup">${e.sup}</div>`:""}${e.items.map(it=>{
  let i=0,h=it.h;
  if(h.includes("{}"))h=h.replace(/\{\}/g,()=>wh(it.w[i],it.n,i++));else h+=(h?"<br>":"")+it.w.map((w,j)=>wh(w,it.n,j)).join(" ");
  return `<div class="q" id="q${it.n}"><span class="n">${it.n}.</span>${h}<div class="fbk"></div></div>`}).join("")}</div>`).join("")+
 `<div style="text-align:center"><p class="c" id="manque"></p><button id="go">✅ Corriger ma fiche</button></div><div id="fres"></div>`;
 window.scrollTo(0,0);
 const items=f.ex.flatMap(e=>e.items),reussi=new Set();
 fx.addEventListener("input",ev=>{const q=ev.target.closest(".q");if(q)q.classList.remove("vide")});
 $("go").onclick=()=>{
  // 1. Tout doit être rempli avant de corriger
  const vides=items.filter(it=>!reussi.has(it.n)&&manque(it));
  items.forEach(it=>$("q"+it.n).classList.toggle("vide",vides.includes(it)));
  if(vides.length){
   $("manque").innerHTML=`<b>Il te reste ${vides.length} question${vides.length>1?"s":""} sans réponse.</b><br>Réponds à tout, même si tu n'es pas sûr(e) : c'est comme ça qu'on progresse.`;
   $("q"+vides[0].n).scrollIntoView({behavior:"smooth",block:"center"});return;
  }
  $("manque").textContent="";
  // 2. Correction : pas de réponse donnée, seulement un conseil
  const tentative=lit(cleT)+1;ecrit(cleT,tentative);
  let sc=0,det=[],open="",rang=0;
  items.forEach(it=>{
   const v=valeurs(it).map(x=>x.value),fb=$("q"+it.n).querySelector(".fbk"),isA=it.w.some(w=>w.k==="a");
   const ok=reussi.has(it.n)||gi(it,v,f.ai);
   if(ok){sc++;reussi.add(it.n)}
   if(isA){fb.innerHTML=`<div class="fb wait">📝 Réponse enregistrée : ton prof la lira.<br>💡 ${CONSEIL_TYPE.a}</div>`;open=" [question ouverte à vérifier]"}
   else fb.innerHTML=ok?`<div class="fb ok">✔ Bien joué !${it.why?" "+it.why:""}</div>`:`<div class="fb ko">✘ Pas encore.<br>💡 <b>Conseil :</b> ${conseil(k,it,v,f.ai,rang++)}</div>`;
   det.push(it.n+(ok?"✔":"✘("+v.join("/").slice(0,50)+")"));
  });
  // seules les questions ratées restent modifiables
  items.forEach(it=>valeurs(it).forEach(x=>x.disabled=true));
  const lv=sc>=14?["N3 — Validé","🎉 Fiche réussie (+100 XP) !"]:sc>=10?["N2 — Fragile","⚠️ Lis les conseils sous tes erreurs, puis corrige-les."]:["N1 — Non acquis","❌ Relis la leçon, puis corrige tes erreurs grâce aux conseils."];
  const d=new Date(),ds=d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),who="Code "+s.code;
  const hs=x=>{let h=5381;for(const c of x)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(-4)},code="F"+k+"-"+hs("F"+k+"|"+who+"|"+sc+"|"+tentative+"|"+ds);
  const txt=`RÉSULTAT FICHE ${k} — ${f.name}\nÉlève : ${who}\nNote : ${sc}/20 (${lv[0]})${open}\nTentative n°${tentative}\nDate : ${ds}\nCode : ${code}\nDétail : ${det.join(" ")}`;
  const rates=items.length-reussi.size;
  $("go").style.display="none";
  $("fres").innerHTML=`<div class="card" style="text-align:center"><div class="score">${sc} / 20</div><div class="bar"><i style="width:${sc*5}%"></i></div><p class="big"><b>${lv[0]}</b><br>${lv[1]}</p><p class="envoi" id="envoi"></p><details id="secours"><summary>📋 Copier mon résultat (si ton prof te le demande)</summary><textarea class="res" readonly id="rt">${txt}</textarea><br><button id="cp">📋 Copier mon résultat</button></details>${rates?`<button id="retry">✏️ Corriger mes ${rates} erreur${rates>1?"s":""}</button>`:""}<button class="alt" onclick="openFiche(${k})">🔄 Recommencer à zéro</button><button class="alt" onclick="closeFiche()">← Retour</button></div>`;
  $("cp").onclick=()=>{const t=$("rt");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}$("cp").textContent="✔ Copié !"};
  envoyer(k,s,items,$("envoi"),$("secours"));
  if(rates)$("retry").onclick=()=>{
   items.forEach(it=>{if(!reussi.has(it.n))valeurs(it).forEach(x=>x.disabled=false)});
   $("fres").innerHTML="";$("go").style.display="";$("go").textContent="✅ Corriger à nouveau";
   const premier=items.find(it=>!reussi.has(it.n));$("q"+premier.n).scrollIntoView({behavior:"smooth",block:"center"});
  };
  $("fres").scrollIntoView({behavior:"smooth"});
 };
}
$("codego").onclick=()=>{const c=$("codein").value.trim().toUpperCase().replace(/\s/g,""),i=D.findIndex(s=>s.code===c);if(i<0&&/^PROF-/.test(c)){vueProf(c);return}if(i<0){$("codemsg").textContent="Code inconnu : vérifie-le avec ton prof.";out.innerHTML="";return}$("codemsg").textContent="";sel.value=String(i);sel.onchange();if(ENVOI_URL)fetch(ENVOI_URL,{method:"POST",body:JSON.stringify({type:"connexion",code:c})}).catch(()=>{})};
/* Vue prof : badges et connexions des deux classes (le code est vérifié par le tableur). */
async function vueProf(c){
 $("codemsg").textContent="⏳ Chargement de la vue prof…";out.innerHTML="";
 let d;
 try{const r=await fetch(ENVOI_URL,{method:"POST",body:JSON.stringify({type:"prof",code:c})});d=await r.json()}catch(e){d={ok:false,erreur:"Connexion au tableau impossible."}}
 if(!d.ok){$("codemsg").textContent=d.erreur==="Code inconnu."?"Code inconnu : vérifie-le avec ton prof.":"⚠️ "+d.erreur;return}
 $("codemsg").textContent="";$("accueil").style.display="none";window.scrollTo(0,0);
 const nb=Object.keys(F).length;
 const cl=d.classes.map(k=>{
  const tot=k.eleves.reduce((a,e)=>a+e.val.length,0),av=k.eleves.reduce((a,e)=>a+e.acq.length,0),cx=k.eleves.filter(e=>e.nbCx).length;
  const lignes=k.eleves.map(e=>{const V=new Set(e.val),A=new Set(e.acq);
   const cases=Object.keys(F).map(n=>`<i class="pc ${V.has(+n)?"ok":A.has(+n)?"av":""}" title="Fiche ${n} · ${F[n][0]}${V.has(+n)?" : validé":A.has(+n)?" : à valider":""}">${n}</i>`).join("");
   return `<tr><td><b>${e.code}</b></td><td>${e.nbCx?`${e.nbCx}<small>${e.derniereCx}</small>`:`<span class="mu">jamais</span>`}</td><td>${e.nbEnvois}</td><td><b>${e.val.length}</b>${e.acq.length?` <span class="av">+${e.acq.length}</span>`:""}</td><td class="cs">${cases}</td></tr>`}).join("");
  return `<h2>${k.nom} — ${k.eleves.length} élèves</h2><div class="pk"><div class="card"><b>${cx}</b>/${k.eleves.length}<small>déjà connectés</small></div><div class="card"><b>${tot}</b><small>badges validés</small></div><div class="card"><b>${av}</b><small>à valider</small></div></div><div class="tw"><table class="pt"><thead><tr><th>Code</th><th>Connexions</th><th>Envois</th><th>Badges</th><th>Fiches 1 à ${nb}</th></tr></thead><tbody>${lignes}</tbody></table></div>`}).join("");

 <h2>Derniers envois de fiches</h2><div class="tw"><table class="pt"><thead><tr><th>Date</th><th>Code</th><th>Fiche</th><th>Note</th><th>Décision</th></tr></thead><tbody>${env}</tbody></table></div>`;
