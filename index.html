<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2238;--mut:#667;--bd:#dfe3ee;--ac:#1f3864}
@media(prefers-color-scheme:dark){:root{--bg:#12162a;--card:#1c2240;--tx:#eef0fa;--mut:#a3a9c4;--bd:#323a62;--ac:#8fb0ff}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:860px;margin:auto;padding:20px 14px 50px}h1{margin:.2em 0;font-size:1.6rem;color:var(--ac)}h2{font-size:1.15rem;margin:1.6em 0 .6em}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.hello{font-size:1.3rem;font-weight:700;margin:18px 0 8px}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f5b700,#ff7a00);border-radius:9px;transition:width .6s}
.next{display:flex;gap:14px;align-items:center;border:2px solid var(--ac)}.next b{font-size:1.15rem}
ol{list-style:none;padding:0;margin:0;display:grid;gap:8px}li.s{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
li.s .n{font-weight:700;min-width:70px;color:var(--mut)}li.s.done{opacity:.6}li.s.now{border:2px solid #ff7a00}li.s .t{margin-left:auto;font-size:.8rem;padding:2px 8px;border-radius:9px;background:var(--bd)}

.exp{border-left:6px solid #f5b700}.msg{margin:10px 0;color:var(--mut)}

.btn2{font:inherit;font-weight:700;margin-top:8px;padding:9px 16px;border-radius:10px;border:2px solid #ff7a00;background:transparent;color:#ff7a00;cursor:pointer}

#fx h1{font-size:1.3rem;margin:0}#fx .top{display:flex;gap:14px;align-items:center;margin:12px 0}#fx .top img{width:84px}#fx h2{font-size:1.05rem;margin:0 0 4px;color:var(--ac)}#fx .c{color:var(--mut);margin:0 0 10px;font-size:.92rem}

#fx input[type=text],#fx textarea,#fx select{font:inherit;padding:5px 8px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%;width:auto;margin:2px 0}#fx input[type=text]{width:150px}#fx input.wide{width:100%;display:block;margin-top:6px}#fx textarea{width:100%;min-height:70px;display:block}
#fx .pre{color:var(--mut);font-size:.9rem}#fx .fb{margin:6px 0 0 26px;font-size:.9rem;padding:6px 10px;border-radius:8px}#fx .fb.ok{background:rgba(40,160,80,.14);color:#1b7a3a}#fx .fb.ko{background:rgba(220,60,50,.13);color:#b3261e}#fx .fb.wait{background:rgba(240,180,0,.2)}

const nzs=(s,ai)=>{s=s.normalize("NFC").toLowerCase().replace(/’/g,"'");if(ai)s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");return s.replace(/[«»"'‑\-.!?;:,\[\]()…]+/g," ").replace(/\s+/g," ").trim()};
const nzp=s=>s.normalize("NFC").toLowerCase().replace(/’/g,"'").replace(/[«»"]/g,"").replace(/\s+,/g,",").replace(/[.!?]+\s*$/,"").replace(/\s+/g," ").trim();
function gw(w,v,ai){
 if(w.k==="s")return w.ok.includes(v);
 if(w.k==="t")return w.ok.some(a=>nzs(a,ai)===nzs(v,ai));
 if(w.k==="p")return w.v.some(a=>nzp(a)===nzp(v));
 const t=nzs(v,ai);
 if(w.k==="x")return new RegExp(w.re,"i").test(t);
 return t.length>=20&&new RegExp(w.re,"i").test(t);
}
function gi(it,v,ai){

 return it.w.every((w,i)=>gw(w,v[i]||"",ai));
}

function wh(w,q,i){
 const a=`data-q="${q}" data-i="${i}"`;
 if(w.k==="s")return `<select ${a}><option value="">— choisis —</option>${w.o.map(o=>`<option value="${esc(o)}">${o}</option>`).join("")}</select>`;
 if(w.k==="p")return `<input type="text" class="wide" ${a} value="${esc(w.init)}" ${AT}>`;
 if(w.k==="a")return `<textarea ${a} spellcheck="false" placeholder="Ta réponse…"></textarea>`;
 if(w.k==="x")return `<input type="text" class="wide" ${a} placeholder="Ta réponse…" ${AT}>`;
 return (w.pre?`<span class="pre">${w.pre}</span> `:"")+`<input type="text" ${a} ${AT}>`;
}
function closeFiche(){$("fx").style.display="none";$("home").style.display="";window.scrollTo(0,0)}
function openFiche(k){
 const f=FI[k],s=D[sel.value];if(!f||!s)return;
 $("home").style.display="none";const fx=$("fx");fx.style.display="";
 fx.innerHTML=`<button class="alt" onclick="closeFiche()">← Retour à mon passeport</button><div class="top">${IMG[k]?`<img src="${IMG[k]}" alt="">`:""}<div><h1>Fiche n°${k} · ${f.name}</h1><p class="sub">${f.comp} · 20 questions · code ${s.code}</p></div></div>`+
 (f.lesson?`<details><summary>📖 Revoir la leçon</summary><div class="card">${f.lesson}</div></details>`:`<p class="sub">📖 <a href="${L(k)}" target="_blank" rel="noopener">Revoir la leçon (PDF)</a></p>`)+
 f.ex.map(e=>`<div class="card"><h2>${e.t}</h2><p class="c">${e.c}</p>${e.sup?`<div class="sup">${e.sup}</div>`:""}${e.items.map(it=>{
  let i=0,h=it.h;
  if(h.includes("{}"))h=h.replace(/\{\}/g,()=>wh(it.w[i],it.n,i++));else h+=(h?"<br>":"")+it.w.map((w,j)=>wh(w,it.n,j)).join(" ");
  return `<div class="q" id="q${it.n}"><span class="n">${it.n}.</span>${h}<div class="fbk"></div></div>`}).join("")}</div>`).join("")+
 `<div style="text-align:center"><button id="go">✅ Corriger ma fiche</button></div><div id="fres"></div>`;
 window.scrollTo(0,0);
 $("go").onclick=()=>{
  let sc=0,det=[],open="";
  f.ex.forEach(e=>e.items.forEach(it=>{
   const v=[...document.querySelectorAll(`#fx [data-q="${it.n}"]`)].sort((a,b)=>a.dataset.i-b.dataset.i).map(x=>x.value);
   const ok=gi(it,v,f.ai);if(ok)sc++;
   const isA=it.w.some(w=>w.k==="a"),fb=$("q"+it.n).querySelector(".fbk");
   fb.innerHTML=isA?`<div class="fb wait">${ok?"✔ Point provisoire":"✘"} — à vérifier par ton prof. Exemple : <i>${it.show}</i></div>`:ok?`<div class="fb ok">✔ Correct.${it.ex?" "+it.ex:""}</div>`:`<div class="fb ko">✘ Attendu : <b>${it.show}</b>${it.ex?" — "+it.ex:""}</div>`;
   det.push(it.n+(ok?"✔":"✘("+v.join("/").slice(0,50)+")"));if(isA)open=" [question ouverte à vérifier]";
  }));
  fx.querySelectorAll("input,select,textarea").forEach(x=>x.disabled=true);
  const lv=sc>=18?["N4 — Master",`👑 Badge #${k} Master ! Tu pourras corriger la fiche ${k} des autres.`]:sc>=14?["N3 — Validé",`✅ Badge #${k} débloqué (+100 XP) !`]:sc>=10?["N2 — Fragile","⚠️ Relis la leçon, puis refais la fiche."]:["N1 — Non acquis","❌ Entraînement à refaire : relis la leçon et recommence."];
  const d=new Date(),ds=d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),who="Code "+s.code;
  const hs=x=>{let h=5381;for(const c of x)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(-4)},code="F"+k+"-"+hs("F"+k+"|"+who+"|"+sc+"|"+ds);
  const txt=`RÉSULTAT FICHE ${k} — ${f.name}\nÉlève : ${who}\nNote : ${sc}/20 (${lv[0]})${open}\nDate : ${ds}\nCode : ${code}\nDétail : ${det.join(" ")}`;
  $("go").style.display="none";
  $("fres").innerHTML=`<div class="card" style="text-align:center"><div class="score">${sc} / 20</div><div class="bar"><i style="width:${sc*5}%"></i></div><p class="big"><b>${lv[0]}</b><br>${lv[1]}</p><p class="c">Le badge est confirmé par ton prof. Copie ce résultat et envoie-le-lui (ENT, Pronote…).</p><textarea class="res" readonly id="rt">${txt}</textarea><br><button id="cp">📋 Copier mon résultat</button><button class="alt" onclick="openFiche(${k})">🔄 Refaire la fiche</button><button class="alt" onclick="closeFiche()">← Mon passeport</button></div>`;
  $("cp").onclick=()=>{const t=$("rt");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}$("cp").textContent="✔ Copié !"};
  $("fres").scrollIntoView({behavior:"smooth"});
 };
}
$("codego").onclick=()=>{const c=$("codein").value.trim().toUpperCase().replace(/\s/g,""),i=D.findIndex(s=>s.code===c);if(i<0){$("codemsg").textContent="Code inconnu : vérifie-le avec ton prof.";out.innerHTML="";return}$("codemsg").textContent="";sel.value=String(i);sel.onchange()};
$("codein").onkeydown=e=>{if(e.key==="Enter")$("codego").onclick()};
</script>
